id = "local.zed-follow"
name = "Zed Follow"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Open the focused workspace's git checkout (worktree) in Zed"
platforms = ["macos"]

[[events]]
on = "workspace.focused"
command = ["sh", "zed-follow.sh"]

[[events]]
on = "worktree.opened"
command = ["sh", "zed-follow.sh"]

[[events]]
on = "worktree.created"
command = ["sh", "zed-follow.sh"]
